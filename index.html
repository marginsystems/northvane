<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northvane | Autonomous Jet Aircraft for Wide-Area Watch</title>
  <meta name="description" content="Northvane builds jet-powered autonomous aircraft and the Meridian AI command layer for wide-area surveillance and emergency response." />
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="modulepreload" href="js/main.js" />
  <link rel="modulepreload" href="js/world.js" />
  <link rel="modulepreload" href="js/content.js" />
  <link rel="modulepreload" href="js/vendor/three.module.min.js" />
  <link rel="modulepreload" href="js/vendor/lenis.mjs" />
  <link rel="preload" href="assets/terrain/height.bin" as="fetch" crossorigin />
  <link rel="preload" href="assets/terrain/meta.json" as="fetch" crossorigin />
  <link rel="preload" href="assets/terrain/albedo.jpg" as="fetch" crossorigin />
  <link rel="preload" href="assets/terrain/light.jpg" as="fetch" crossorigin />
</head>
<body class="is-booting">

  <!-- Boot splash -->
  <div id="boot" aria-hidden="true">
    <svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="4"><path d="M12 46a20 20 0 0 1 40 0"/><path d="M20 46l12-9 12 9"/><path d="M20 38l12-9 12 9"/></g></svg>
    <div class="boot-status">
      <div class="boot-bar"><i></i></div>
      <div class="boot-label mono">Loading assets</div>
    </div>
  </div>

  <!-- Header -->
  <header class="nav" id="nav">
    <button class="nav-logo" id="logo" aria-label="Northvane home">
      <svg class="logo-full" viewBox="0 0 150 24" aria-hidden="true"><text x="0" y="19">Northvane</text></svg>
    </button>
    <nav class="scene-nav" id="scene-nav" aria-label="Sections"></nav>
    <div class="nav-right">
      <button class="pill pill-sm" data-contact>Contact</button>
      <button class="burger" id="burger" aria-label="Open menu"><i></i><i></i><i></i></button>
    </div>
  </header>

  <!-- Fixed stage: WebGL + scene overlays -->
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="labels" class="labels"></div>
    <svg id="lines" class="lines" aria-hidden="true"></svg>
    <div id="overlay" class="overlay"></div>
  </div>

  <main id="main">
    <div id="scroll-spacer" style="height:6700vh"></div>

    <section id="cases" class="cases"></section>

    <section id="globe" class="globe-sec"></section>

    <section id="autonomy" class="autonomy"></section>

    <section id="founders" class="founders"></section>

    <footer class="footer" id="footer"></footer>
  </main>

  <!-- Menu drawer -->
  <div class="menu" id="menu" aria-hidden="true"></div>

  <!-- Contact modal -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title"></div>

  <div class="grain" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
